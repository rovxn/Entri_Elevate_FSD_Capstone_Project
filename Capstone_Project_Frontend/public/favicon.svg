<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur" />
      <feOffset in="blur" dx="5" dy="5" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Ball Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#ballGradient)" filter="url(#shadow)" />
  
  <!-- Seam Stitching (Curved Lines) -->
  <path d="M140,40 Q256,220 372,40" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="20,15" />
  <path d="M140,472 Q256,292 372,472" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="20,15" />
  
  <!-- Main Seam (Horizontal-ish) -->
  <path d="M40,256 Q256,256 472,256" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="0" transform="rotate(-45, 256, 256)" opacity="0.9" />

  <!-- Shine/Highlight -->
  <ellipse cx="180" cy="180" rx="80" ry="60" fill="white" opacity="0.2" transform="rotate(-45, 180, 180)" />
</svg>
